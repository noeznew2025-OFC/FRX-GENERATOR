
      - name: Build APK
        run: |
          echo "Mencari folder project..."
          find . -name settings.gradle.kts -o -name settings.gradle

          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Project ditemukan: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FARUQ-GENERATOR-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
